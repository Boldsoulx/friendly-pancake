<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get in touch with us using our contact form." />
    <title>Contact Us</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f6fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 640px);
        padding: clamp(24px, 5vw, 40px);
        background: #fff;
        border: 1px solid #e1e7f0;
        border-radius: 18px;
        box-shadow: 0 16px 40px rgb(23 32 51 / 8%);
      }

      h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 2.5rem); }
      .intro { margin: 0 0 28px; color: #5d687b; line-height: 1.6; }
      form { display: grid; gap: 18px; }
      .field { display: grid; gap: 7px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      label { font-weight: 650; }
      input, textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd4e1;
        border-radius: 9px;
        color: inherit;
        font: inherit;
      }
      input:focus, textarea:focus {
        outline: 3px solid rgb(37 99 235 / 20%);
        border-color: #2563eb;
      }
      textarea { min-height: 160px; resize: vertical; }
      button {
        justify-self: start;
        padding: 12px 20px;
        border: 0;
        border-radius: 9px;
        background: #2563eb;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
      button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }

      @media (max-width: 520px) {
        .row { grid-template-columns: 1fr; }
        button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Contact Us</h1>
      <p class="intro">Have a question or need a hand? Send us a message and we’ll get back to you as soon as we can.</p>

      <form action="https://formspree.io/f/xqpqzenp" method="POST">
        <div class="row">
          <div class="field">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" required />
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit">Send message</button>
      </form>
    </main>
  </body>
</html>
