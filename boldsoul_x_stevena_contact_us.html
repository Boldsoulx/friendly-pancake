<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — BoldSoul x Stevena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

  <div class="w-full max-w-lg bg-neutral-900 border border-neutral-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">Get in Touch</h1>
      <p class="text-neutral-400 text-sm">Have a question about your order or our drops? Drop us a line below.</p>
      <div class="mt-3 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-neutral-800/80 border border-neutral-700/60 text-xs text-neutral-300">
        <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        <span>Responses sent from: <strong class="text-amber-400 font-medium">info@boldsoulxstevena.store</strong></span>
      </div>
    </div>

    <form action="https://formspree.io/f/xqpqzenp" method="POST" class="space-y-4">
      <div>
        <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1.5">Full Name *</label>
        <input type="text" id="name" name="name" required autocomplete="name" placeholder="Steven Adams"
          class="w-full px-4 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-neutral-100 placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 text-sm transition" />
      </div>

      <div>
        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1.5">Your Email Address *</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com"
          class="w-full px-4 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-neutral-100 placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 text-sm transition" />
      </div>

      <div>
        <label for="order" class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1.5">Order Number (Optional)</label>
        <input type="text" id="order" name="order" placeholder="#BSX-1049"
          class="w-full px-4 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-neutral-100 placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 text-sm transition" />
      </div>

      <div>
        <label for="message" class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-1.5">Message *</label>
        <textarea id="message" name="message" rows="4" required placeholder="Tell us what you need help with..."
          class="w-full px-4 py-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-neutral-100 placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 text-sm transition resize-none"></textarea>
      </div>

      <button type="submit"
        class="w-full py-3 px-4 bg-amber-500 hover:bg-amber-400 text-neutral-950 font-semibold rounded-xl text-sm transition shadow-lg shadow-amber-500/20 active:scale-[0.99] flex items-center justify-center gap-2">
        <span>Send Message</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

      <p class="text-center text-[11px] text-neutral-500 mt-2">
        Our support team replies within 12–24 hours via <span class="text-neutral-400">info@boldsoulxstevena.store</span>.
      </p>
    </form>
  </div>
</body>
</html>
